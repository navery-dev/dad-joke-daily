        // Function to get the number of days since a reference date
        function getDaysSinceEpoch() {
            const now = new Date();
            // Set to midnight to ensure consistency throughout the day
            now.setHours(0, 0, 0, 0);
            // Use January 1, 2024 as reference date
            const epoch = new Date('2024-01-01');
            epoch.setHours(0, 0, 0, 0);
            const diffTime = Math.abs(now - epoch);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return diffDays;
        }

        function getThanksgivingDate(year) {
            // Thanksgiving is the 4th Thursday of November
            const november = new Date(year, 10, 1); // Month 10 = November
            const firstDay = november.getDay(); // 0 = Sunday, 4 = Thursday
            
            // Calculate days until first Thursday
            const daysUntilThursday = (4 - firstDay + 7) % 7;
            const firstThursday = 1 + daysUntilThursday;
            const fourthThursday = firstThursday + 21; // Add 3 weeks
            
            return fourthThursday;
        }

        function getFathersDayDate(year) {
            // Father's Day is the 3rd Sunday of June
            const june = new Date(year, 5, 1); // Month 5 = June
            const firstDay = june.getDay(); // 0 = Sunday
            
            // Calculate days until first Sunday
            const daysUntilSunday = (7 - firstDay) % 7;
            const firstSunday = 1 + daysUntilSunday;
            const thirdSunday = firstSunday + 14; // Add 2 weeks
            
            return thirdSunday;
        }

        // Function to get today's joke
        function getTodaysJoke() {
            const dayIndex = getDaysSinceEpoch();
            const jokeIndex = dayIndex % dadJokes.length;
            return dadJokes[jokeIndex];
        }

        // Function to format the date
        function formatDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date().toLocaleDateString('en-US', options);
        }

        // Function to create falling emojis
        function createFallingEmojis(emojis, duration = 10000) {
            const emojiCount = 30; // Number of emojis to create
            const interval = 300; // Time between each emoji spawn (ms)
            let created = 0;

            const emojiInterval = setInterval(() => {
                if (created >= emojiCount) {
                    clearInterval(emojiInterval);
                    return;
                }

                const emoji = document.createElement('div');
                emoji.className = 'falling-emoji';
                emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];

                // Random horizontal position
                emoji.style.left = Math.random() * 100 + 'vw';
                // Start from top of screen (above viewport)
                emoji.style.top = '-100px';

                // Random fall duration (3-6 seconds)
                const fallDuration = 3 + Math.random() * 3;
                emoji.style.animationDuration = fallDuration + 's';

                document.body.appendChild(emoji);

                // Remove emoji after animation completes
                setTimeout(() => {
                    emoji.remove();
                }, fallDuration * 1000);

                created++;
            }, interval);

            // Stop creating new emojis after the specified duration
            setTimeout(() => {
                clearInterval(emojiInterval);
            }, duration);
        }

        // Display the joke and date
        const specialDate = checkSpecialDates();
        if (specialDate) {
            document.getElementById('joke').textContent = specialDate.message;
            // Trigger falling emojis animation (runs for 10 seconds)
            createFallingEmojis(specialDate.emojis, 10000);
        }
        else{
            document.getElementById('joke').textContent = getTodaysJoke();
        }
        document.getElementById('currentDate').textContent = formatDate();

        // Update at midnight
        function scheduleNextUpdate() {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);
            const timeUntilMidnight = tomorrow - now;

            setTimeout(() => {
                document.getElementById('joke').textContent = getTodaysJoke();
                document.getElementById('currentDate').textContent = formatDate();
                scheduleNextUpdate(); // Schedule next update
            }, timeUntilMidnight);
        }
